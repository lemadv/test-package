version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:18.17

jobs:
  pre-release:
    executor: node-executor
    steps:
      - checkout
      
      - run:
          name: Set Up npm Cache
          command: |
            mkdir -p ~/.npm && echo "Setting up npm cache"
      - restore_cache:
          keys:
            - npm-cache-{{ checksum "package-lock.json" }}
      
      - run:
          name: Install Dependencies
          command: npm ci
      
      - save_cache:
          paths:
            - ~/.npm
          key: npm-cache-{{ checksum "package-lock.json" }}

      - run:
          name: Configure Git
          command: |
            git config --global user.name "$CIRCLE_USERNAME"
            git config --global user.email "$CIRCLE_USERNAME@users.noreply.github.com"

      - run:
          name: Get Next RC Version
          command: |
            set -e
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            ALL_VERSIONS=$(npm view test-package-lema2 versions --json)
            CURRENT_RC=$(echo $ALL_VERSIONS | jq -r '.[]' | grep "^${CURRENT_VERSION}-rc\." || true)
            if [ -z "$CURRENT_RC" ]; then
              NEXT_VERSION="${CURRENT_VERSION}-rc.1"
            else
              HIGHEST_RC=$(echo "$CURRENT_RC" | sort -V | tail -1)
              NEXT_VERSION=$(npx semver "$HIGHEST_RC" --increment prerelease --preid rc)
            fi
            echo "export NEXT_VERSION=$NEXT_VERSION" >> $BASH_ENV
            echo "Next RC version: $NEXT_VERSION"

      - run:
          name: Update Version in package.json
          command: npm version $NEXT_VERSION --no-git-tag-version

      - run:
          name: Debug Environment Variable
          command: |
             echo "Variable is available: $NPM_TOKEN"

      - run:
          name: Set Up npm Authentication
          command: |
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc

      - run:
          name: Publish Pre-release to npm
          command: npm publish --tag rc
          environment:
            NODE_AUTH_TOKEN: $NPM_TOKEN

      - run:
          name: Create and Push Git Tag
          command: |
            git tag v$NEXT_VERSION
            git push origin v$NEXT_VERSION

      - run:
          name: Debug Environment Variable
          command: |
             echo "Variable is available: $GITHUB_TOKEN"

      - run:
          name: Print All Environment Variables
          command: printenv

      - run:
          name: Generate Release Notes
          shell: /bin/bash
          command: |

            # Run the Node.js script to generate release notes
            node generate-release-notes.js

            # Debug: Show the generated release notes
            echo "Generated release notes:"
            cat release_notes.md

            # Export release notes as an environment variable
            echo "export RELEASE_NOTES=$(<release_notes.md)" >> $BASH_ENV

      - run:
          name: Create GitHub Release
          shell: /bin/bash
          command: |
            # Check that release notes are generated
            if [ ! -f release_notes.md ]; then
              echo "❌ release_notes.md not found. Make sure the Generate Release Notes step ran correctly."
              exit 1
            fi

            # Read the entire file into a variable, preserving newlines
            RELEASE_NOTES=$(<release_notes.md)

            # Debug: Output the release notes
            echo "Release Notes:"
            echo "$RELEASE_NOTES"

            # Generate payload using jq, ensuring multiline strings are preserved
            PAYLOAD=$(jq -n --arg tag_name "v$NEXT_VERSION" \
                            --arg name "Release v$NEXT_VERSION" \
                            --arg body "$RELEASE_NOTES" \
                            '{tag_name: $tag_name, name: $name, body: $body, draft: false, prerelease: true}')
            echo "Payload: $PAYLOAD"

            # Send the payload to create the GitHub release
            curl -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              https://api.github.com/repos/lemadv/test-package/releases

  update-changelog:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout

      # STEP 1 – discover PR number & base branch
      - run:
          name: "Detect PR metadata"
          command: |
            set -euo pipefail

            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "❌  Not a PR build – skipping"; exit 0
            fi
            PR_NUM=$(echo "$CIRCLE_PULL_REQUEST" | grep -o '[0-9]*$')

            data=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls/$PR_NUM")

            BASE_BRANCH=$(echo "$data" | jq -r .base.ref)
            echo "PR #$PR_NUM → base = $BASE_BRANCH"
            echo "PR_NUM=$PR_NUM"     >> $BASH_ENV
            echo "BASE_BRANCH=$BASE_BRANCH" >> $BASH_ENV

      # STEP 2 – get compact file list via GitHub API (1 request/page)
      - run:
          name: "Fetch changed-file list"
          command: |
            source $BASH_ENV
            curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls/$PR_NUM/files?per_page=100" \
              | jq -r '[ .[] | {file:.filename, add:.additions, del:.deletions} ]' \
              > files.json                              # ≤ ~10 KB for 100 files

      # STEP 3 – build OpenAI prompt safely
      - run:
          name: "Call OpenAI"
          command: |
            jq -n --slurpfile f files.json '
              {
                model: "gpt-4o-mini",
                temperature: 0.3,
                messages: [
                  {
                    role: "system",
                    content: "You are a senior engineer. Summarise the PR as a markdown bullet list, grouping by component or config area."
                  },
                  {
                    role: "user",
                    content: ("Changed files (with +/– lines):\n\n" + ($f[0] | map("- " + .file + " (+" + (.add|tostring) + "/-" + (.del|tostring) + ")") | join("\n")))
                  }
                ]
              }' > payload.json

            SUMMARY=$(curl -sS \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              --data @payload.json \
              https://api.openai.com/v1/chat/completions \
              | jq -r '.choices[0].message.content')

            if [ -z "$SUMMARY" ] || [ "$SUMMARY" = "null" ]; then
              echo "❌ OpenAI call failed"; cat payload.json; exit 1
            fi
            echo "----- summary -----"
            echo "$SUMMARY"
            echo "-------------------"

            # save for downstream jobs or slack step
            echo "$SUMMARY" > pr_summary.md
workflows:
  version: 2
  pre-release-workflow:
    jobs:
      - pre-release:
          filters:
                branches:
                  only: master
  pr_workflow:
    jobs:
      - update-changelog:
          context: open-ai
          filters:
            branches:
              ignore: master
