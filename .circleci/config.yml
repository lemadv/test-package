version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:18.17

jobs:
  pre-release:
    executor: node-executor
    steps:
      - checkout
      
      - run:
          name: Set Up npm Cache
          command: |
            mkdir -p ~/.npm && echo "Setting up npm cache"
      - restore_cache:
          keys:
            - npm-cache-{{ checksum "package-lock.json" }}
      
      - run:
          name: Install Dependencies
          command: npm ci
      
      - save_cache:
          paths:
            - ~/.npm
          key: npm-cache-{{ checksum "package-lock.json" }}

      - run:
          name: Configure Git
          command: |
            git config --global user.name "$CIRCLE_USERNAME"
            git config --global user.email "$CIRCLE_USERNAME@users.noreply.github.com"

      - run:
          name: Get Next RC Version
          command: |
            set -e
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            ALL_VERSIONS=$(npm view test-package-lema2 versions --json)
            CURRENT_RC=$(echo $ALL_VERSIONS | jq -r '.[]' | grep "^${CURRENT_VERSION}-rc\." || true)
            if [ -z "$CURRENT_RC" ]; then
              NEXT_VERSION="${CURRENT_VERSION}-rc.1"
            else
              HIGHEST_RC=$(echo "$CURRENT_RC" | sort -V | tail -1)
              NEXT_VERSION=$(npx semver "$HIGHEST_RC" --increment prerelease --preid rc)
            fi
            echo "export NEXT_VERSION=$NEXT_VERSION" >> $BASH_ENV
            echo "Next RC version: $NEXT_VERSION"

      - run:
          name: Update Version in package.json
          command: npm version $NEXT_VERSION --no-git-tag-version

      - run:
          name: Debug Environment Variable
          command: |
             echo "Variable is available: $NPM_TOKEN"

      - run:
          name: Set Up npm Authentication
          command: |
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc

      - run:
          name: Publish Pre-release to npm
          command: npm publish --tag rc
          environment:
            NODE_AUTH_TOKEN: $NPM_TOKEN

      - run:
          name: Create and Push Git Tag
          command: |
            git tag v$NEXT_VERSION
            git push origin v$NEXT_VERSION

      - run:
          name: Debug Environment Variable
          command: |
             echo "Variable is available: $GITHUB_TOKEN"

      - run:
          name: Print All Environment Variables
          command: printenv

      - run:
          name: Generate Release Notes
          shell: /bin/bash
          command: |

            # Run the Node.js script to generate release notes
            node generate-release-notes.js

            # Debug: Show the generated release notes
            echo "Generated release notes:"
            cat release_notes.md

            # Export release notes as an environment variable
            echo "export RELEASE_NOTES=$(<release_notes.md)" >> $BASH_ENV

      - run:
          name: Create GitHub Release
          shell: /bin/bash
          command: |
            # Check that release notes are generated
            if [ ! -f release_notes.md ]; then
              echo "❌ release_notes.md not found. Make sure the Generate Release Notes step ran correctly."
              exit 1
            fi

            # Read the entire file into a variable, preserving newlines
            RELEASE_NOTES=$(<release_notes.md)

            # Debug: Output the release notes
            echo "Release Notes:"
            echo "$RELEASE_NOTES"

            # Generate payload using jq, ensuring multiline strings are preserved
            PAYLOAD=$(jq -n --arg tag_name "v$NEXT_VERSION" \
                            --arg name "Release v$NEXT_VERSION" \
                            --arg body "$RELEASE_NOTES" \
                            '{tag_name: $tag_name, name: $name, body: $body, draft: false, prerelease: true}')
            echo "Payload: $PAYLOAD"

            # Send the payload to create the GitHub release
            curl -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              https://api.github.com/repos/lemadv/test-package/releases

  update-changelog:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout

      # STEP 1 – discover PR number & base branch
      - run:
          name: "Detect PR metadata"
          command: |
            set -euo pipefail

            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "❌  Not a PR build – skipping"; exit 0
            fi
            
            echo "CIRCLE_PULL_REQUEST: ${CIRCLE_PULL_REQUEST}"
            
            # Hardcode correct GitHub repository information
            GITHUB_OWNER="lemadv"
            GITHUB_REPO="test-package"
            
            echo "Using GitHub repository: $GITHUB_OWNER/$GITHUB_REPO"
            
            # Extract PR number from CIRCLE_PULL_REQUEST URL
            PR_NUM=$(echo "$CIRCLE_PULL_REQUEST" | grep -o '[0-9]*$')
            echo "Extracted PR number: $PR_NUM"
            
            # Get PR data and save raw response for debugging
            PR_API_URL="https://api.github.com/repos/$GITHUB_OWNER/$GITHUB_REPO/pulls/$PR_NUM"
            echo "Fetching PR data from: $PR_API_URL"
            
            curl -s -H "Authorization: token $GITHUB_TOKEN" "$PR_API_URL" > pr_data.json
            
            echo "Raw PR data response:"
            cat pr_data.json
            
            # Check if response contains error message
            if grep -q "message.*Not Found" pr_data.json; then
              echo "❌ GitHub API returned 'Not Found'. Check GitHub token permissions and repository details."
              echo "Using fallback branch information"
              BASE_BRANCH="${CIRCLE_BRANCH:-main}"
              PR_TITLE="PR #${PR_NUM}"
            else
              # Extract required fields
              BASE_BRANCH=$(jq -r '.base.ref // "main"' pr_data.json)
              PR_TITLE=$(jq -r '.title // "PR #'$PR_NUM'"' pr_data.json)
            fi
            
            echo "PR #$PR_NUM → base = $BASE_BRANCH, title = $PR_TITLE"
            echo "PR_NUM=$PR_NUM" >> $BASH_ENV
            echo "BASE_BRANCH=$BASE_BRANCH" >> $BASH_ENV
            echo "PR_TITLE=$PR_TITLE" >> $BASH_ENV
            echo "GITHUB_OWNER=$GITHUB_OWNER" >> $BASH_ENV
            echo "GITHUB_REPO=$GITHUB_REPO" >> $BASH_ENV

      # STEP 2 – get compact file list via GitHub API
      - run:
          name: "Fetch changed-file list"
          command: |
            source $BASH_ENV
            echo "Fetching files for PR #$PR_NUM"
            
            # Save raw API response and print it
            curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_OWNER/$GITHUB_REPO/pulls/$PR_NUM/files?per_page=100" \
              > raw_files_response.json
            
            echo "Raw API response:"
            cat raw_files_response.json
          
            
            # Process files more carefully - falling back to simple file list if needed
            if jq -e 'map({file: .filename, add: .additions, del: .deletions})' raw_files_response.json > files.json 2>/dev/null; then
              echo "✅ Successfully processed file list using normal format"
            elif jq -e '[.[] | {file: .filename, add: .additions, del: .deletions}]' raw_files_response.json > files.json 2>/dev/null; then
              echo "✅ Successfully processed file list using alternative format"
            else
              echo "⚠️ Could not extract structured file data, creating simplified list"
              jq -r '.[].filename' raw_files_response.json > file_list.txt
              echo "[" > files.json
              while read filename; do
                echo "  {\"file\": \"$filename\", \"add\": 0, \"del\": 0}," >> files.json
              done < file_list.txt
              # Remove trailing comma and close array
              sed -i '$ s/,$//' files.json
              echo "]" >> files.json
            fi
            
            echo "Processed files.json content:"
            cat files.json
            
            # Ensure files.json is valid JSON
            if ! jq empty files.json 2>/dev/null; then
              echo "❌ Failed to create valid files.json"
              exit 1
            fi

      # STEP 3 – build OpenAI prompt and get summary
      - run:
          name: "Generate PR Summary"
          command: |
            source $BASH_ENV
            
            echo "Building OpenAI payload with PR title: $PR_TITLE"
            
            # Create a simplified payload with fewer tokens
            jq -n --slurpfile f files.json --arg title "$PR_TITLE" '
              {
                model: "gpt-3.5-turbo",
                temperature: 0.3,
                messages: [
                  {
                    role: "system",
                    content: "Write a concise changelog entry (single sentence)"
                  },
                  {
                    role: "user",
                    content: ("PR Title: " + $title + "\nFormat as a bullet point starting with a verb.")
                  }
                ]
              }' > payload.json
            
            echo "Payload created:"
            cat payload.json
            
            echo "Calling OpenAI API..."
            OPENAI_RESPONSE=$(curl -sS \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              --data @payload.json \
              https://api.openai.com/v1/chat/completions)
            
            echo "Raw OpenAI response:"
            echo "$OPENAI_RESPONSE"
            
            # Try to extract content from response
            SUMMARY=$(echo "$OPENAI_RESPONSE" | jq -r '.choices[0].message.content // empty')
            
            # If API call failed, use hardcoded summary for testing
            if [ -z "$SUMMARY" ] || [ "$SUMMARY" = "null" ]; then
              echo "❌ OpenAI call failed, using hardcoded summary for testing"
              SUMMARY="Update configuration for improved stability and performance"
            else
              echo "✅ Successfully received summary from OpenAI"
            fi
            
            echo "Generated summary:"
            echo "$SUMMARY"
            echo "$SUMMARY" > pr_summary.md

      # STEP 4 – Update CHANGELOG.md
      - run:
          name: "Update CHANGELOG.md"
          command: |
            source $BASH_ENV
            # Create CHANGELOG.md if it doesn't exist
            if [ ! -f CHANGELOG.md ]; then
              echo "# Changelog" > CHANGELOG.md
              echo "" >> CHANGELOG.md
              echo "## [Unreleased]" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
            fi

            # Add PR summary to CHANGELOG.md
            echo "- $SUMMARY" >> CHANGELOG.md

      # STEP 5 – Commit and push changes
      - run:
          name: "Commit and push changes"
          command: |
            source $BASH_ENV
            git config --global user.name "CircleCI Bot"
            git config --global user.email "circleci@example.com"
            
            git add CHANGELOG.md
            git commit -m "docs: update changelog for PR #$PR_NUM"
            git push origin HEAD:$CIRCLE_BRANCH

workflows:
  version: 2
  pre-release-workflow:
    jobs:
      - pre-release:
          filters:
                branches:
                  only: master
  pr_workflow:
    jobs:
      - update-changelog:
          context: open-ai
          filters:
            branches:
              ignore: master
